version: v1
managed:
  enabled: true
  go_package_prefix:
    default: github.com/Lumpy-Studio/Unity-Build-API/gen/go

plugins:
  - plugin: buf.build/protocolbuffers/go
    out: gen/go
  - plugin: buf.build/grpc/go
    out: gen/go
  - plugin: buf.build/protocolbuffers/python
    out: gen/python
  - plugin: buf.build/grpc/python
    out: gen/python
  - plugin: buf.build/bufbuild/es
    out: gen/typescript
