name: Contract CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.34.0'
          github_token: ${{ github.token }}
      - run: buf lint
      - run: buf build
      - name: Check wire compatibility
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=origin/main'

  publish-bsr:
    if: github.event_name == 'push'
    needs: contract
    runs-on: ubuntu-latest
    env:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.34.0'
          github_token: ${{ github.token }}
      - name: Publish to the Buf Schema Registry
        if: ${{ env.BUF_TOKEN != '' }}
        run: buf push --git-metadata
      - name: Report GitHub-only distribution
        if: ${{ env.BUF_TOKEN == '' }}
        run: echo "::notice::BUF_TOKEN is not configured; the tagged GitHub contract remains the supported distribution channel."
