name: Contract CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.34.0'
          github_token: ${{ github.token }}
      - run: buf lint
      - run: buf build
      - name: Check wire compatibility
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=origin/main'

  publish-bsr:
    if: github.event_name == 'push'
    needs: contract
    runs-on: ubuntu-latest
    env:
      BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.34.0'
          github_token: ${{ github.token }}
      - name: Require the Buf publisher credential
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BUF_TOKEN)) {
            throw 'BUF_TOKEN must be configured for every public API release.'
          }
      - name: Publish to the Buf Schema Registry
        run: buf push --git-metadata
