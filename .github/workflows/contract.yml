name: Contract CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.34.0'
      - run: buf lint
      - run: buf build
      - name: Check wire compatibility
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=origin/main'
